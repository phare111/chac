[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chac"
version = "10.36.0"
description = "Adaptive execution of frozen OmniNav waypoint plans"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow>=9.1", "scipy"]

[tool.setuptools]
packages = ["chac"]

[tool.setuptools.package-data]
chac = ["ovon.yaml"]
